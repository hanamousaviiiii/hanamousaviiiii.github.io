# Builds the site from content/ + _build/ and publishes it to GitHub Pages.
# Runs on every push to main (including every "Publish" in the admin panel at /admin/).
# One-time setting: Repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (auto video covers)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Build pages
        run: python3 _build/gen.py

      - name: Collect site files
        run: |
          mkdir _site
          # only the website itself is published: build scripts, raw content JSON, the Apps Script
          # source, docs and dotfiles stay in the repo but are not served
          rsync -a --exclude '.git' --exclude '.github' --exclude '_build' --exclude '_site' \
                --exclude 'screenshots' --exclude '__pycache__' --exclude 'content' --exclude 'apps-script' \
                --exclude 'README.md' --exclude '*.md' --exclude '.gitignore' --exclude '*.bak' --exclude '*.zip' \
                --exclude '*.map' --exclude '.env*' --exclude '*.py' --exclude '*.gs' --exclude '.DS_Store' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
