  # ------------------------------------------------------------ سایت › سؤالات متداول › راهنماها
  - name: faq
    label: "سایت › سؤالات متداول › راهنماها"
    label_singular: "راهنما"
    description: "راهنماهای کامل که در https://aistudiohana.ir/ai-faq.html فهرست می‌شوند و هر کدام صفحه جدا در https://aistudiohana.ir/faq/ دارند. برای راهنمای جدید، دکمه «افزودن راهنما» را بزنید."
    folder: content/faq
