# Admin panel (Decap CMS) for aistudiohana.ir
# Every "Publish" saves a JSON file in content/ to GitHub; the GitHub Action rebuilds and publishes the site in ~1-2 minutes.
# Field labels are in Persian for Hana. Docs: https://decapcms.org/docs/configuration-options/

backend:
  # Email/password login through DecapBridge (https://decapbridge.com), "Classic" auth type (no auth_type key).
  name: git-gateway
  repo: hanamousaviiiii/hanamousaviiiii.github.io
  branch: main
  identity_url: https://auth.decapbridge.com/sites/4dac6425-2d13-4cc2-ab14-41d00f7a38eb
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "پنل: ایجاد {{collection}} «{{slug}}» ({{author-name}})"
    update: "پنل: ویرایش {{collection}} «{{slug}}» ({{author-name}})"
    delete: "پنل: حذف {{collection}} «{{slug}}» ({{author-name}})"
    uploadMedia: "پنل: آپلود {{path}} ({{author-name}})"
    deleteMedia: "پنل: حذف فایل {{path}} ({{author-name}})"

# Only used on http://localhost with `npx decap-server` (for testing); ignored on the live site.
local_backend: true

locale: fa
site_url: https://aistudiohana.ir
display_url: https://aistudiohana.ir
logo_url: https://aistudiohana.ir/assets/img/mark.svg
show_preview_links: false

# Uploaded photos and videos go here. Paths are saved as /assets/media/uploads/<file>.
media_folder: assets/media/uploads
public_folder: /assets/media/uploads

collections:
  # ------------------------------------------------------------ سایت › صفحه اصلی
  - name: home
    label: "سایت › صفحه اصلی"
    description: "متن‌ها، ترتیب بخش‌ها، کارت‌های مهارت و سؤالات متداول پایین صفحه. نمایش در https://aistudiohana.ir/"
    editor: { preview: false }
    files:
      - name: home
        label: "صفحه اصلی"
        file: content/home.json
        fields:
          - label: "ترتیب و نمایش بخش‌ها"
            name: sections
            widget: list
            label_singular: "بخش"
            hint: "برای جابه‌جایی، بخش‌ها را با گرفتن و کشیدن بالا و پایین ببرید. برای پنهان‌کردن یک بخش، تیک «نمایش» را بردارید. هدر بالای سایت (با منظومه‌ی متحرک) همیشه اول است و این‌جا نیست."
            summary: "{{fields.key}}"
            collapsed: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - label: "بخش"
                name: key
                widget: select
                options:
                  - { label: "نوار کلمات متحرک", value: "marquee" }
                  - { label: "جمله‌ی میانی ۱: همه‌چیز از یک نقطه شروع شد", value: "interlude-1" }
                  - { label: "چرا همین حالا (کارت‌های مهارت)", value: "why" }
                  - { label: "معرفی چالش", value: "challenge" }
                  - { label: "کارت‌های دوره", value: "courses" }
                  - { label: "جمله‌ی میانی ۲: نقطه‌ها به هم وصل شدن", value: "interlude-2" }
                  - { label: "باکس نمونه‌کار هنرجوها", value: "showcase" }
                  - { label: "رضایت هنرجوها", value: "voices" }
                  - { label: "درباره‌ی من", value: "about" }
                  - { label: "جمله‌ی میانی ۳: و آینده این‌جا شکل می‌گیره", value: "interlude-3" }
                  - { label: "سؤالات پرتکرار هوش مصنوعی", value: "ai-faq" }
                  - { label: "سؤالات متداول دوره‌ها", value: "faq" }
                  - { label: "دعوت پایانی (قدم اول)", value: "final" }
              - { label: "نمایش", name: visible, widget: boolean, default: true }
          - label: "بالای صفحه (هدر)"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "متن زیر عنوان", name: lead, widget: text }
              - { label: "برچسب‌های کوچک زیر دکمه‌ها", name: meta, widget: list, label_singular: "برچسب", field: { label: "برچسب", name: item, widget: string } }
          - label: "کارت‌های «چرا همین حالا»"
            name: features
            widget: list
            label_singular: "کارت"
            summary: "{{fields.title}}"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            hint: "برای افزودن کارت، دکمه «افزودن کارت» را بزنید. ترتیب کارت‌ها با کشیدن عوض می‌شود. شماره‌ی کارت‌ها (۰۱، ۰۲...) خودکار است."
            fields:
              - { label: "عنوان", name: title, widget: string }
              - { label: "توضیح", name: text, widget: text }
              - label: "آیکون"
                name: icon
                widget: select
                options: &icon_options

                  - { label: "ستاره / جرقه", value: "spark" }
                  - { label: "پرامپت", value: "prompt" }
                  - { label: "تصویر", value: "image" }
                  - { label: "ویدیو", value: "video" }
                  - { label: "صدا", value: "wave" }
                  - { label: "ادیت", value: "edit" }
                  - { label: "رشد و درآمد", value: "growth" }
                  - { label: "دوربین", value: "camera" }
                  - { label: "لایه‌ها / موشن", value: "layers" }
                  - { label: "لبخند / زیبایی", value: "smile" }
                  - { label: "موبایل / استوری", value: "phone" }
                  - { label: "فیلم / سریال", value: "film" }
                  - { label: "کیف خرید / محصول", value: "bag" }
                  - { label: "موسیقی", value: "music" }
                  - { label: "پخش", value: "play" }
                  - { label: "کتاب", value: "book" }
                  - { label: "سپر / پشتیبانی", value: "shield" }
                  - { label: "آپدیت", value: "refresh" }
                  - { label: "هدف / چالش", value: "target" }
                  - { label: "وب‌سایت", value: "globe" }
                  - { label: "تلگرام", value: "telegram" }
                  - { label: "اینستاگرام", value: "instagram" }
                  - { label: "همکاری", value: "brief" }
                  - { label: "ایمیل", value: "mail" }
                  - { label: "ساعت", value: "clock" }
                  - { label: "تیک", value: "check" }

              - { label: "کارت پهن (دو ستونه)", name: wide, widget: boolean, default: false }
          - label: "کلمات نوار متحرک"
            name: marquee
            widget: list
            label_singular: "کلمه"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            field: { label: "کلمه", name: item, widget: string }
          - label: "درباره‌ی من"
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: "عکس هانا", name: photo, widget: image, required: false, choose_url: false }
              - { label: "متن جایگزین عکس", name: alt, widget: string, required: false, hint: "توضیح کوتاه عکس برای دسترسی و سئو" }
              - { label: "متن داستان (برای پاراگراف جدید یک خط خالی بگذارید)", name: story, widget: text, required: false }
          - label: "سؤالات متداول پایین صفحه"
            name: faqs
            widget: list
            label_singular: "سؤال"
            summary: "{{fields.q}}"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            hint: "برای افزودن سؤال، دکمه «افزودن سؤال» را بزنید. برای حذف، سؤال را باز کنید و حذف را بزنید."
            fields:
              - { label: "سؤال", name: q, widget: string }
              - { label: "جواب", name: a, widget: text }

  # ------------------------------------------------------------ سایت › صفحه اصلی › رضایت هنرجوها
  - name: testimonials
    label: "سایت › صفحه اصلی › رضایت هنرجوها"
    description: "نظرها و اسکرین‌شات‌های رضایت هنرجوها. فقط در صفحه اصلی (https://aistudiohana.ir/) نمایش داده می‌شوند. برای افزودن، این بخش را باز کنید و دکمه «افزودن نظر» را بزنید."
    editor: { preview: false }
    files:
      - name: testimonials
        label: "رضایت هنرجوها"
        file: content/testimonials.json
        fields:
          - label: "نظرها"
            name: items
            widget: list
            label_singular: "نظر"
            summary: "{{fields.name}}"
            collapsed: false
            required: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            hint: "برای افزودن نظر، دکمه «افزودن نظر» را بزنید. برای حذف، نظر را باز کنید و حذف را بزنید. تا وقتی هیچ نظری اضافه نشده، سه کادر نمونه در سایت نشان داده می‌شود."
            fields:
              - { label: "نام هنرجو", name: name, widget: string }
              - { label: "دوره", name: course, widget: string, required: false }
              - { label: "متن نظر", name: text, widget: text, required: false }
              - { label: "اسکرین‌شات رضایت (اختیاری)", name: screenshot, widget: image, required: false, choose_url: false }
              - { label: "عکس هنرجو (اختیاری)", name: photo, widget: image, required: false, choose_url: false }
              - { label: "نمایش در سایت", name: visible, widget: boolean, default: true }

  # ------------------------------------------------------------ سایت › دوره‌ها
  - name: courses
    label: "سایت › دوره‌ها"
    description: "قیمت، سرفصل‌ها، ویژگی‌ها، سؤالات و فصل‌های هر دوره. هر دوره را جدا باز کنید. فهرست دوره‌ها: https://aistudiohana.ir/course.html — دوره دستیار هوشمند: https://aistudiohana.ir/courses/smart-assistant.html و صفحه‌های فصل‌ها در https://aistudiohana.ir/chapters/ — دوره ادیتور پلاس: https://aistudiohana.ir/courses/editor-plus.html"
    editor: { preview: false }
    files:
      - name: smart-assistant
        label: "دوره دستیار هوشمند"
        file: content/courses/smart-assistant.json
        fields: &course_fields
          - { label: "نام دوره", name: name, widget: string }
          - { label: "شهریه", name: price, widget: string, hint: "مثلاً ۶٫۵ میلیون تومان" }
          - { label: "نمایش در سایت", name: visible, widget: boolean, default: true }
          - { label: "نام انگلیسی", name: latin, widget: string }
          - { label: "شماره‌ی رومی روی کارت", name: num, widget: string }
          - label: "نقش وسط کارت"
            name: emblem
            widget: select
            options:
              - { label: "چشم و ستاره (دستیار هوشمند)", value: assistant }
              - { label: "فیلم (ادیتور پلاس)", value: editor }
          - { label: "زیرعنوان پشت کارت", name: card_sub, widget: string }
          - label: "نکته‌های پشت کارت"
            name: card_points
            widget: list
            label_singular: "نکته"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            field: { label: "نکته", name: item, widget: string }
            hint: "فقط سه مورد اول نمایش داده می‌شود"
          - { label: "خط پایین پشت کارت", name: card_more, widget: string }
          - { label: "زیرعنوان صفحه‌ی دوره", name: page_sub, widget: string }
          - { label: "معرفی دوره", name: intro, widget: text }
          - { label: "عنوان سئو", name: seo_title, widget: string, required: false }
          - { label: "توضیح سئو", name: seo_desc, widget: text, required: false }
          - { label: "تیتر H2 سئو", name: seo_h2, widget: string, required: false }
          - { label: "متن سئو", name: seo_lead, widget: text, required: false }
          - { label: "تعداد فصل‌ها (متن)", name: count_label, widget: string, hint: "مثلاً ۱۴ فصل" }
          - label: "سرفصل‌ها"
            name: syllabus
            widget: list
            label_singular: "سرفصل"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            field: { label: "سرفصل", name: item, widget: string }
          - label: "فصل‌ها (صفحه‌های جدا)"
            name: chapters
            widget: list
            label_singular: "فصل"
            summary: "{{fields.title}}"
            collapsed: true
            required: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            hint: "برای افزودن فصل، دکمه «افزودن فصل» را بزنید. هر فصل یک صفحه در https://aistudiohana.ir/chapters/ می‌سازد. ترتیب با کشیدن عوض می‌شود. برای حذف، فصل را باز کنید و حذف را بزنید."
            fields:
              - { label: "عنوان فصل", name: title, widget: string }
              - { label: "نشانی فصل (انگلیسی، بدون فاصله)", name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "فقط حروف کوچک انگلیسی، عدد و خط تیره"], hint: "آدرس می‌شود chapters/این-نشانی.html — برای فصل‌های موجود تغییرش ندهید" }
              - { label: "خلاصه", name: summary, widget: text, required: false }
              - label: "بعد از این فصل چه می‌دانی؟"
                name: outcomes
                widget: list
                label_singular: "نتیجه"
                required: false
                allow_add: true
                allow_remove: true
                allow_reorder: true
                field: { label: "نتیجه", name: item, widget: string }
              - { label: "عنوان سئو (اختیاری)", name: seo_title, widget: string, required: false }
              - { label: "توضیح سئو (اختیاری)", name: seo_desc, widget: text, required: false }
              - { label: "تیتر H2 صفحه فصل (اختیاری)", name: h2, widget: string, required: false }
              - { label: "متن بالای صفحه فصل (اختیاری)", name: lead, widget: text, required: false }
          - label: "ویژگی‌ها (سه کادر بالای سرفصل‌ها)"
            name: perks
            widget: list
            label_singular: "ویژگی"
            summary: "{{fields.title}}"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - { label: "عنوان", name: title, widget: string, hint: "{count} = تعداد فصل‌ها" }
              - { label: "توضیح", name: text, widget: string }
              - label: "آیکون"
                name: icon
                widget: select
                options: *icon_options
          - { label: "عنوان بلوک پشتیبانی", name: support_title, widget: string, required: false, hint: "مثلاً سه ماه پشتیبانی، مستقیم با مدرس" }
          - { label: "متن بلوک پشتیبانی", name: support_text, widget: text, required: false, hint: "اگر خالی باشد، بلوک پشتیبانی در صفحه‌ی دوره نمایش داده نمی‌شود" }
          - { label: "برای چه کسانی؟", name: audience, widget: text, required: false }
          - { label: "ویدیوی معرفی دوره (اختیاری)", name: intro_video, widget: file, required: false, choose_url: false }
          - { label: "کاور ویدیوی معرفی (اختیاری)", name: intro_poster, widget: image, required: false, choose_url: false }
          - label: "سؤالات دوره"
            name: faqs
            widget: list
            label_singular: "سؤال"
            summary: "{{fields.q}}"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            hint: "برای افزودن سؤال، دکمه «افزودن سؤال» را بزنید. اگر جواب خالی باشد، در سایت «به‌زودی» نوشته می‌شود."
            fields:
              - { label: "سؤال", name: q, widget: string }
              - { label: "جواب (خالی = به‌زودی)", name: a, widget: text, required: false }
          - label: "زیرعنوان دوره در نتیجه‌ی چالش"
            name: js_subtitle
            widget: string
            required: false
          - { label: "توضیح کوتاه دوره در نتیجه‌ی چالش", name: js_teaser, widget: text, required: false }
          - label: "مزایا در نتیجه‌ی چالش"
            name: js_perks
            widget: list
            label_singular: "مزیت"
            required: false
            allow_add: true
            allow_remove: true
            field: { label: "مزیت", name: item, widget: string }
          - { label: "شناسه‌ی فنی (تغییر ندهید)", name: id, widget: string, pattern: ["^(smart-assistant|editor-plus|[a-z0-9-]+)$", "فقط حروف انگلیسی"] }
      - name: editor-plus
        label: "دوره ادیتور پلاس"
        file: content/courses/editor-plus.json
        fields: *course_fields

  # ------------------------------------------------------------ سایت › مقالات
  - name: articles
    label: "سایت › مقالات"
    label_singular: "مقاله"
    description: "مقاله‌های مجله. فهرست در https://aistudiohana.ir/blog.html و هر مقاله صفحه جدا در https://aistudiohana.ir/articles/ دارد. برای مقاله جدید، دکمه «افزودن مقاله» را بزنید."
    folder: content/articles
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: url
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "عنوان مقاله", name: title, widget: string }
      - { label: "نشانی مقاله (انگلیسی، بدون فاصله)", name: url, widget: string, pattern: ["^[a-z0-9-]+$", "فقط حروف کوچک انگلیسی، عدد و خط تیره، مثل ai-tools-guide"], hint: "آدرس صفحه می‌شود: https://aistudiohana.ir/articles/این-نشانی.html و کارت آن در صفحه مجله می‌آید." }
      - { label: "توضیح کوتاه (برای گوگل و کارت مقاله)", name: description, widget: text }
      - { label: "برچسب", name: tag, widget: string, hint: "مثلاً پرامپت یا ویدیو" }
      - { label: "زمان مطالعه (دقیقه)", name: minutes, widget: string, default: "۵" }
      - { label: "تاریخ انتشار (اختیاری)", name: date, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "ترتیب نمایش (عدد کمتر = بالاتر، اولی ویژه است)", name: order, widget: number, value_type: int, default: 10 }
      - { label: "منتشر شود", name: published, widget: boolean, default: true }
      - { label: "عکس کاور (اختیاری)", name: image, widget: image, required: false, choose_url: false }
      - label: "طرح رنگی کاور (اگر عکس ندارید)"
        name: cover
        widget: select
        default: a1
        options:
            - { label: "طرح ۱", value: "a1" }
            - { label: "طرح ۲", value: "a2" }
            - { label: "طرح ۳", value: "a3" }
            - { label: "طرح ۴", value: "a4" }
            - { label: "طرح ۵", value: "a5" }
            - { label: "طرح ۶", value: "a6" }
            - { label: "طرح ۷", value: "a7" }
      - label: "متن مقاله"
        name: body
        widget: markdown
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image", "code-block"]
        hint: "«نقل‌قول» به شکل کادر نکته نمایش داده می‌شود."

  # ------------------------------------------------------------ سایت › نمونه‌کار هنرجو › تنظیمات
  - name: works_settings
    label: "سایت › نمونه‌کار هنرجو › تنظیمات و فصل‌ها"
    description: "نام و ترتیب فصل‌های گالری و تنظیمات نمایش. خود نمونه‌کارها در پوشه‌های جدا زیر همین بخش هستند. نمایش در https://aistudiohana.ir/student-works.html و باکس نمونه‌کار در صفحه اصلی."
    editor: { preview: false }
    files:
      - name: works_settings
        label: "تنظیمات و فهرست فصل‌ها"
        file: content/works.json
        fields:
          - label: "فصل‌ها"
            name: chapters
            widget: list
            label_singular: "فصل"
            summary: "{{fields.title}}"
            collapsed: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            hint: "هر فصل یک کارت در صفحه‌ی نمونه‌کارهاست. ترتیب فصل‌ها با کشیدن عوض می‌شود. برای پنهان‌کردن یک فصل، تیک «نمایش در سایت» را بردارید. برای افزودن نمونه‌کار داخل یک فصل، از پوشه‌ی همان فصل در منوی سمت راست استفاده کنید. اگر فصل تازه‌ای ساختید، به گوژی بگویید تا دکمه «افزودن نمونه‌کار» آن فصل را هم در پنل اضافه کند."
            fields:
              - { label: "نام فصل", name: title, widget: string }
