  # ------------------------------------------------------------ سایت › تنظیمات کلی
  - name: site
    label: "سایت › تنظیمات کلی"
    description: "لینک اینستاگرام و تلگرام و افزونه‌هایی که در همه یا بعضی صفحه‌ها می‌آیند. صفحه جدا ندارند. صفحه‌های چالش و همکاری متن ثابتی دارند و از این پنل ویرایش نمی‌شوند."
    editor: { preview: false }
    files:
      - name: site
        label: "تنظیمات و افزونه‌ها"
        file: content/site.json
        fields:
          - { label: "لینک اینستاگرام", name: instagram, widget: string }
          - { label: "لینک تلگرام", name: telegram, widget: string }
          - label: "افزونه‌ها (کد اضافه در همه‌ی صفحه‌ها)"
            name: plugins
            widget: list
            label_singular: "افزونه"
            required: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            summary: "{{fields.name}}"
            collapsed: true
            hint: "برای افزودن افزونه، دکمه «افزودن افزونه» را بزنید. برای ابزارهایی مثل آمار بازدید، چت آنلاین یا کد تأیید گوگل. فقط کدی بگذارید که از سرویس معتبر گرفته‌اید."
            fields:
              - { label: "نام افزونه", name: name, widget: string }
              - { label: "فعال", name: enabled, widget: boolean, default: true }
              - label: "محل قرارگیری"
                name: place
                widget: select
                default: head
                options:
                  - { label: "بالای صفحه (head)", value: head }
                  - { label: "پایین صفحه (قبل از body/)", value: body }
              - { label: "فقط در این صفحه‌ها (اختیاری)", name: pages, widget: string, required: false, hint: "مثلاً index.html, blog.html — خالی = همه‌ی صفحه‌ها" }
              - { label: "کد", name: code, widget: code, default_language: html, output_code_only: true, allow_language_selection: false }
              - { label: "دامنه‌های مجاز (امنیت، اختیاری)", name: csp, widget: string, required: false, hint: "اگه افزونه کار نکرد، دامنه‌هایی که سرویس اعلام کرده رو با فاصله بنویسید؛ مثلاً www.googletagmanager.com www.google-analytics.com. دامنه‌های داخل خود کد خودکار مجاز می‌شن." }
